plugins {
	id 'fabric-loom' version '1.9-SNAPSHOT'
	id 'java'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

loom {
	accessWidenerPath = file("src/main/resources/securitycraft.accesswidener")
}

java {
	toolchain.languageVersion = JavaLanguageVersion.of(21)
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

repositories {
	maven { url = 'https://maven.fabricmc.net/' }
	maven { url = 'https://maven.blamejared.com' } // JEI
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// Use official Mojang mappings so the code matches the upstream NeoForge source names 1:1.
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// JEI (soft dependency at runtime): dev-time compile + runtime so the keypad info page shows. Not a hard depends in fabric.mod.json.
	modImplementation "mezz.jei:jei-${project.minecraft_version}-fabric:${project.jei_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = "UTF-8"
	options.release = 21
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.archives_base_name}" }
	}
}
