# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Fabric port of SecurityCraft — per-version properties.
# Base target of this branch. The version-by-version matrix lives in versions/ (Stonecutter, added later).
minecraft_version=1.21.6
loader_version=0.16.14
fabric_api_version=0.128.2+1.21.6

# Mojang (official) mappings are used via loom.officialMojangMappings() in build.gradle,
# so the source matches the upstream NeoForge names 1:1. No yarn version needed.

# Mod metadata (upstream values preserved)
mod_version=0.3
maven_group=net.geforcemods.securitycraft
archives_base_name=securitycraft-fabric
